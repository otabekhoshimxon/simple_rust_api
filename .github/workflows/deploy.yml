name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  BINARY_NAME: simple_rust_api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "target/release/${{ env.BINARY_NAME }}"
          target: "/tmp/deploy"
          strip_components: 2

      - name: Install binary and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            ls -la /tmp/deploy
            sudo systemctl stop simple-rest-api || true
            sudo mv /tmp/deploy/${{ env.BINARY_NAME }} /opt/simple-rest-api/${{ env.BINARY_NAME }}
            sudo chmod +x /opt/simple-rest-api/${{ env.BINARY_NAME }}
            sudo systemctl start simple-rest-api
            sudo systemctl status simple-rest-api --no-pager
